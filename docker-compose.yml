version: '3.8'

services:
  ghibli-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ghibli-api-dev
    ports:
      - "8082:8082"
    environment:
      - STABILITY_API_KEY=${STABILITY_API_KEY}
      - GROQ_API_KEY=${GROQ_API_KEY}
      - SERVER_PORT=8082
    volumes:
      # For development - mount source code
      - ./src:/app/src
      - ./target:/app/target
    networks:
      - ghibli-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  ghibli-network:
    driver: bridge
